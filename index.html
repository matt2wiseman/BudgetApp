/* ---------- app shell ---------- */
function Alert({ d, onDone }){
  return html`<div class="alert-wrap" role="alertdialog" aria-modal="true" aria-labelledby="alert-t">
    <div class="alert">
      <div class="alert-body"><h3 id="alert-t">${d.title}</h3>${d.message ? html`<p>${d.message}</p>` : null}</div>
      <div class="alert-btns">
        <button onClick=${() => onDone(false)}>${d.cancel || 'Cancel'}</button>
        <button class=${d.destructive ? 'destructive' : 'strong'} ref=${el => el && !el.dataset.f && (el.dataset.f = '1', el.focus())} onClick=${() => onDone(true)}>${d.confirm || 'OK'}</button>
      </div>
    </div>
  </div>`;
}
function Toast({ t, onClose }){
  useEffect(() => { const id = setTimeout(onClose, 4500); return () => clearTimeout(id); }, [t.id]);
  return html`<div class="toast" role="status">${t.msg}${t.undo ? html`<button onClick=${() => { t.undo(); onClose(); }}>Undo</button>` : null}</div>`;
}

function App(){
  const [ready, setReady] = useState(false);
  const [main, setMain] = useState(null);
  const [history, setHistory] = useState([]);
  const [tab, setTab] = useState('budget');
  const [today, setToday] = useState(todayISO());
  const [stack, setStack] = useState([]);
  const [dialog, setDialog] = useState(null);
  const [toast, setToast] = useState(null);
  const [status, setStatus] = useState({ state:'idle' });

  useEffect(() => {
    store.onStatus = s => setStatus(s);
    (async () => {
      const res = await store.init();
      let m = normMain(res.main);
      const hist = (res.history || []).map(normPeriod).filter(Boolean).sort(byStartDesc);
      if (!m) m = freshMain();
      store.markSaved(m, hist);
      setMain(m); setHistory(hist); setReady(true);
    })();
    const onVis = () => { if (document.visibilityState === 'visible') setToday(todayISO()); else store.flush(); };
    const onHide = () => store.flush();
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('pagehide', onHide);
    const iv = setInterval(() => setToday(todayISO()), 60000);
    return () => { document.removeEventListener('visibilitychange', onVis); window.removeEventListener('pagehide', onHide); clearInterval(iv); };
  }, []);

  useEffect(() => { if (ready) store.saveMain(main); }, [main, ready]);
  useEffect(() => { if (ready) store.saveLocal(main, history); }, [main, history, ready]);
  useEffect(() => {
    if (!main) return;
    const t = main.settings.theme, el = document.documentElement;
    if (t === 'auto') el.removeAttribute('data-theme'); else el.setAttribute('data-theme', t);
  }, [main && main.settings.theme]);
  useEffect(() => { document.body.style.overflow = stack.length ? 'hidden' : ''; }, [stack.length]);

  const open = useCallback(renderFn => setStack(s => [...s, { id: uid(), render: renderFn }]), []);
  const closeTop = useCallback(() => setStack(s => s.slice(0, -1)), []);
  const ask = useCallback(opts => new Promise(res => setDialog({ ...opts, res })), []);
  const notify = useCallback((msg, undo) => setToast({ id: uid(), msg, undo }), []);

  useEffect(() => {
    const k = e => {
      if (e.key !== 'Escape') return;
      if (dialog){ dialog.res(false); setDialog(null); return; }
      const top = escStack[escStack.length - 1]; if (top) top();
    };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, [dialog]);

  const dispatch = useCallback(a => setMain(m => ({ ...m, current: periodReducer(m.current, a) })), []);

  if (!ready) return html`<div class="loading">Loading your budget…</div>`;

  const onSetup = (len, start) => setMain(m => ({ ...m, setupDone:true, settings:{ ...m.settings, length:len }, current:{ ...m.current, start, end: periodEnd(start, len), length: len } }));
  const applyPeriod = (len, start) => setMain(m => ({ ...m, setupDone:true, settings:{ ...m.settings, length:len }, current:{ ...m.current, start, end: periodEnd(start, len), length: len } }));
  const setTheme = t => setMain(m => ({ ...m, settings:{ ...m.settings, theme:t } }));
  const rollover = ({ note, start, carry }) => {
    const saved = { ...main.current, note, savedAt: new Date().toISOString() };
    setHistory(h => [saved, ...h.filter(x => x.id !== saved.id)].sort(byStartDesc));
    store.savePeriod(saved);
    setMain(m => ({ ...m, setupDone:true, current: newPeriod(start, saved.length, saved, carry) }));
    try { window.scrollTo({ top:0, behavior:'smooth' }); } catch (e) {}
    notify('Period saved to Analytics');
  };
  const savePeriod = p => { setHistory(h => h.map(x => x.id === p.id ? p : x).sort(byStartDesc)); store.savePeriod(p); notify('Period updated'); };
  const deletePeriod = id => { setHistory(h => h.filter(x => x.id !== id)); store.deletePeriod(id); notify('Period deleted'); };
  const importAll = (m, hist) => {
    const keep = new Set(hist.map(h => h.id));
    for (const h of history) if (!keep.has(h.id)) store.deletePeriod(h.id);
    for (const h of hist) store.savePeriod(h);
    setMain(m); setHistory(hist.sort(byStartDesc)); notify('Backup imported');
  };
  const eraseAll = () => {
    for (const h of history) store.deletePeriod(h.id);
    setHistory([]); setMain(freshMain()); setTab('budget'); notify('All data erased');
  };
  const openPeriod = p => open(close => html`<${PeriodSheet} close=${close} period=${p} onSave=${savePeriod} onDelete=${deletePeriod} open=${open} ask=${ask} notify=${notify} />`);
  const openSettings = () => open(close => html`<${SettingsSheet} close=${close} main=${main} history=${history} storageMode=${store.mode} status=${status}
    onApply=${applyPeriod} onTheme=${setTheme} onImport=${importAll} onErase=${eraseAll} ask=${ask} notify=${notify} />`);
  const openRollover = () => open(close => html`<${RolloverSheet} close=${close} p=${main.current} onConfirm=${rollover} />`);
  const switchTab = t => { setTab(t); try { window.scrollTo(0, 0); } catch (e) {} };

  const errMsg = status.state !== 'error' ? null
    : status.code === 'invalid_argument' ? 'You have view-only access here, so changes can’t be saved.'
    : status.code === 'quota_exceeded' ? 'Storage is full. Export a backup, then delete some old periods.'
    : status.code === 'local' ? 'This browser’s storage is full, so recent changes may not be kept. Export a backup.'
    : 'Your last change didn’t save. Check your connection and try again.';

  return html`<div>
    <main class="app">
      ${errMsg ? html`<div class="banner error" role="alert" style="margin-top:12px"><p>${errMsg}</p></div>` : null}
      ${tab === 'budget'
        ? html`<${BudgetScreen} main=${main} dispatch=${dispatch} today=${today} open=${open} ask=${ask} notify=${notify} onSetup=${onSetup} openSettings=${openSettings} openRollover=${openRollover} />`
        : html`<${AnalyticsScreen} main=${main} history=${history} today=${today} openPeriod=${openPeriod} />`}
    </main>
    <nav class="tabbar" aria-label="Sections"><div class="tabbar-inner">
      <button class="tab" aria-current=${tab === 'budget' ? 'page' : null} onClick=${() => switchTab('budget')}>${Icon.budget(tab === 'budget')}Budget</button>
      <button class="tab" aria-current=${tab === 'analytics' ? 'page' : null} onClick=${() => switchTab('analytics')}>${Icon.chart(tab === 'analytics')}Analytics</button>
    </div></nav>
    ${stack.map(s => html`<div key=${s.id}>${s.render(closeTop)}</div>`)}
    ${toast ? html`<${Toast} key=${toast.id} t=${toast} onClose=${() => setToast(null)} />` : null}
    ${dialog ? html`<${Alert} d=${dialog} onDone=${v => { dialog.res(v); setDialog(null); }} />` : null}
  </div>`;
}

render(html`<${App} />`, document.getElementById('app'));
})();
</script>
<noscript><p style="padding:24px">This budget needs JavaScript turned on.</p></noscript>
</body>
</html>
